<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flowix — paleta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fx-ink);
      color: var(--fx-text);
      font-family: var(--fx-font);
      line-height: 1.5;
    }
    main { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .logo { height: 36px; width: auto; }
    h1 { font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; margin: 48px 0 8px; }
    h1 em { font-style: normal; color: var(--fx-blue); }
    .lede { color: var(--fx-text-muted); max-width: 42rem; margin: 0 0 40px; }
    .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .swatch { border-radius: var(--fx-radius-control); overflow: hidden; background: var(--fx-surface); }
    .chip { height: 96px; }
    .meta { padding: 12px 14px 14px; }
    .meta strong { display: block; font-size: 14px; }
    .meta span { color: var(--fx-text-muted); font-size: 13px; }
    .ink { background: var(--fx-ink); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .blue { background: var(--fx-blue); }
    .white { background: var(--fx-white); }
    section { margin-top: 48px; }
    h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fx-text-muted); font-weight: 500; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .panel { border-radius: var(--fx-radius-control); padding: 28px; min-height: 140px; display: flex; align-items: center; }
    .panel img { height: 42px; }
    .on-light { background: var(--fx-white); }
    .tagline { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin: 12px 0 0; }
    .flow {
      margin-top: 12px;
      height: 120px;
      border-radius: var(--fx-radius-control);
      background:
        radial-gradient(120px 80px at 12% 80%, rgba(26,110,255,0.35), transparent 70%),
        var(--fx-surface);
      overflow: hidden;
    }
    @media (max-width: 700px) {
      .swatches, .pair { grid-template-columns: 1fr; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="logos/logo-full-light.svg" alt="Flowix" />
    </header>
    <h1>Automatizamos o <em>presente</em>.<br />Libertamos o futuro.</h1>
    <p class="lede">Tinta, azul e branco. O azul é o mark e a ênfase. O texto de corpo fica branco neste fundo.</p>
    <div class="swatches">
      <article class="swatch">
        <div class="chip ink"></div>
        <div class="meta"><strong>Ink</strong><span>#01010d · fundo e texto no claro</span></div>
      </article>
      <article class="swatch">
        <div class="chip blue"></div>
        <div class="meta"><strong>Blue</strong><span>#1a6eff · mark e ênfase</span></div>
      </article>
      <article class="swatch">
        <div class="chip white"></div>
        <div class="meta"><strong>White</strong><span>#ffffff · texto no escuro</span></div>
      </article>
    </div>
    <section>
      <h2>Logótipo</h2>
      <div class="pair">
        <div class="panel" style="background: var(--fx-ink)"><img src="logos/logo-full-light.svg" alt="Flowix em fundo escuro" /></div>
        <div class="panel on-light"><img src="logos/logo-full-ink.svg" alt="Flowix em fundo claro" /></div>
      </div>
    </section>
    <section>
      <h2>Fluxo</h2>
      <div class="flow" aria-hidden="true">
        <svg viewBox="0 0 960 120" width="100%" height="120" fill="none">
          <path d="M-20 90 C 120 90, 180 20, 320 28 S 520 110, 680 70 S 860 10, 1000 40" stroke="#1a6eff" stroke-width="1.25" opacity="0.9"/>
          <path d="M-20 102 C 140 100, 200 36, 340 42 S 540 118, 700 84 S 880 24, 1000 52" stroke="#1a6eff" stroke-width="1" opacity="0.45"/>
          <path d="M-20 78 C 100 80, 160 8, 300 16 S 500 96, 660 56 S 840 0, 1000 28" stroke="#1a6eff" stroke-width="1" opacity="0.28"/>
        </svg>
      </div>
      <p class="tagline">A inteligência artificial é o novo fluxo.</p>
    </section>
  </main>
</body>
</html>
